; Minimal USB MSC proof-of-concept.
;
; Mounts the SD card and exposes it to the host as a USB mass storage device,
; using the exact descriptor + MSC callback logic from Launcher
; (https://github.com/bmorcelli/Launcher src/massStorage.cpp: the PR #297
; descriptor fix and the issue #424 partial-sector transfer fix), with all the
; display / menu / WiFi / OTA code stripped out.
;
; Purpose: isolate "device acts as USB drive" from the rest of Launcher, so a
; device that fails to mount on a host can be debugged against a firmware that
; does nothing else.
;
; Build:   pio run -e t-deck-plus
; Flash:   pio run -e t-deck-plus -t upload
; Log:     /msc-poc.log in the SD card root (see README.md)

[platformio]
default_envs = cardputer-adv

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-Os
	-Wl,--print-memory-usage
	-DPOC_VERSION='"${sysenv.POC_VERSION}"'

; ---------------------------------------------------------------------------
; M5Stack Cardputer (original) - identical SD wiring to the ADV
; ---------------------------------------------------------------------------
[env:cardputer]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Cardputer"'
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

; ---------------------------------------------------------------------------
; M5Stack Cardputer ADV
; SD on its own SPI bus, separate from the display
; ---------------------------------------------------------------------------
[env:cardputer-adv]
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"Cardputer ADV"'
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

; ---------------------------------------------------------------------------
; LilyGo T-Deck (original)
; ---------------------------------------------------------------------------
[env:t-deck]
board_upload.flash_size = 16MB
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"T-Deck"'
	-DSDCARD_CS=39
	-DSDCARD_SCK=40
	-DSDCARD_MISO=38
	-DSDCARD_MOSI=41

; ---------------------------------------------------------------------------
; LilyGo T-Deck Plus (identical SD wiring to the T-Deck; adds GPS + battery)
; ---------------------------------------------------------------------------
[env:t-deck-plus]
board_upload.flash_size = 16MB
build_flags =
	${env.build_flags}
	-DDEVICE_NAME='"T-Deck Plus"'
	-DSDCARD_CS=39
	-DSDCARD_SCK=40
	-DSDCARD_MISO=38
	-DSDCARD_MOSI=41

; ---------------------------------------------------------------------------
; LilyGo T-Deck Pro (e-paper; SD shares the SPI bus with the panel)
; ---------------------------------------------------------------------------
[env:t-deck-pro]
board_upload.flash_size = 16MB
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DDEVICE_NAME='"T-Deck Pro"'
	-DSDCARD_CS=48
	-DSDCARD_SCK=36
	-DSDCARD_MISO=47
	-DSDCARD_MOSI=33
